name: Teaching reminders

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teaching-reminders
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scan schedules and send eligible reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REMINDER_URL: https://giaovukns.mettasoul.vn/api/cron/teaching-reminders
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing repository secret CRON_SECRET."
            exit 1
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-time 90 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$REMINDER_URL"
