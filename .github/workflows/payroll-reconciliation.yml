name: Payroll reconciliation
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: payroll-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retry saved payroll and cancellation requests
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 65 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://giaovukns.mettasoul.vn/api/cron/payroll-reconciliation
